<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tienda Kodda{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        .hero-banner {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: #fff;
            padding: 3.5rem 1rem;
            border-radius: 1rem;
        }
        .card-product {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: none;
        }
        .card-product:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.12) !important;
        }
        .product-img {
            height: 220px;
            object-fit: cover;
            border-top-left-radius: 0.375rem;
            border-top-right-radius: 0.375rem;
        }
        .badge-category {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Navbar Comercial -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-uppercase fs-4" href="{% url 'catalogo' %}">
                <i class="bi bi-shop me-2 text-primary"></i>Tienda Kodda
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" href="{% url 'catalogo' %}">Inicio / Catálogo</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <a href="{% url 'lista_productos' %}" class="btn btn-outline-light btn-sm">
                        <i class="bi bi-speedometer2 me-1"></i> Panel Admin
                    </a>
                    <button class="btn btn-primary position-relative" data-bs-toggle="offcanvas" data-bs-target="#offcanvasCarrito">
                        <i class="bi bi-cart3 fs-5"></i>
                        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="cartBadge">
                            0
                        </span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Contenido Principal Dinámico -->
    <div class="container my-4 flex-grow-1">
        {% block content %}{% endblock %}
    </div>

    <!-- Offcanvas Carrito Simulado -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasCarrito">
        <div class="offcanvas-header bg-dark text-white">
            <h5 class="offcanvas-title"><i class="bi bi-cart3 me-2"></i>Tu Carrito</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body d-flex flex-column">
            <div id="cartItemsList" class="flex-grow-1">
                <p class="text-muted text-center my-5">El carrito está vacío por el momento.</p>
            </div>
            <div class="border-top pt-3">
                <div class="d-flex justify-content-between fs-5 fw-bold mb-3">
                    <span>Total:</span>
                    <span id="cartTotal">$0</span>
                </div>
                <button class="btn btn-success w-100 py-2 fw-bold" onclick="alert('¡Gracias por simular tu compra en Tienda Kodda!')">
                    Finalizar Compra
                </button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <div class="container">
            <p class="mb-0 small">&copy; 2026 Tienda Kodda. Todos los derechos reservados.</p>
        </div>
    </footer>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Script de Carrito Interactivo -->
    <script>
        let carrito = [];
        let total = 0;

        function agregarAlCarrito(nombre, precio) {
            carrito.push({ nombre, precio });
            total += precio;
            actualizarCarritoUI();
        }

        function actualizarCarritoUI() {
            const count = carrito.length;
            document.getElementById('cartBadge').innerText = count;

            const listContainer = document.getElementById('cartItemsList');
            if (count === 0) {
                listContainer.innerHTML = '<p class="text-muted text-center my-5">El carrito está vacío por el momento.</p>';
            } else {
                let html = '<ul class="list-group list-group-flush mb-3">';
                carrito.forEach((item, index) => {
                    html += `
                        <li class="list-group-item d-flex justify-content-between align-items-center bg-transparent px-0">
                            <div>
                                <strong class="d-block">${item.nombre}</strong>
                                <small class="text-muted">$ ${item.precio.toLocaleString('es-CL')}</small>
                            </div>
                            <button onclick="eliminarDelCarrito(${index})" class="btn btn-sm text-danger border-0">
                                <i class="bi bi-trash"></i>
                            </button>
                        </li>`;
                });
                html += '</ul>';
                listContainer.innerHTML = html;
            }

            document.getElementById('cartTotal').innerText = `$ ${total.toLocaleString('es-CL')}`;
        }

        function eliminarDelCarrito(index) {
            total -= carrito[index].precio;
            carrito.splice(index, 1);
            actualizarCarritoUI();
        }
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
