<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lista de Categorías - Tienda Kodda</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Gestión de Categorías</h2>
            <div>
                <a href="{% url 'lista_productos' %}" class="btn btn-secondary">Ver Productos</a>
                <a href="{% url 'crear_categoria' %}" class="btn btn-primary">+ Nueva Categoría</a>
            </div>
        </div>

        <form method="GET" action="" class="input-group mb-4">
            <input type="text" name="q" value="{{ query }}" placeholder="Buscar categoría..." class="form-control">
            <button class="btn btn-outline-primary" type="submit">Buscar</button>
            {% if query %}
                <a href="{% url 'lista_categorias' %}" class="btn btn-outline-secondary">Limpiar</a>
            {% endif %}
        </form>

        <div class="card shadow-sm">
            <div class="card-body">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for cat in categorias %}
                        <tr>
                            <td>{{ cat.id }}</td>
                            <td><strong>{{ cat.nombre }}</strong></td>
                            <td>{{ cat.descripcion|default:"Sin descripción" }}</td>
                            <td>
                                <a href="{% url 'editar_categoria' cat.id %}" class="btn btn-sm btn-warning">Editar</a>
                                <a href="{% url 'eliminar_categoria' cat.id %}" class="btn btn-sm btn-danger">Eliminar</a>
                            </td>
                        </tr>
                        {% empty %}
                        <tr>
                            <td colspan="4" class="text-center text-muted py-4">No se encontraron categorías.</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
