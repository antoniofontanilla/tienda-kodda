<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Confirmar Eliminación - Tienda Kodda</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 500px;">
        <div class="card shadow-sm border-danger">
            <div class="card-body text-center p-4">
                <h3 class="text-danger mb-3">¿Estás seguro?</h3>
                <p class="mb-4">Vas a eliminar el/la {{ tipo }}: <strong>"{{ objeto }}"</strong>. Esta acción no se puede deshacer.</p>
                <form method="POST">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3">
                        <a href="{% if tipo == 'producto' %}{% url 'lista_productos' %}{% else %}{% url 'lista_categorias' %}{% endif %}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-danger">Sí, eliminar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
